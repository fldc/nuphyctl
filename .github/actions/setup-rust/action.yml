name: Setup Rust
description: Install Rust toolchain, optional system dependencies, and cache build artifacts

inputs:
  toolchain:
    description: Rust toolchain version
    required: false
    default: stable
  components:
    description: Comma-separated Rust components to install
    required: false
    default: ''
  targets:
    description: Comma-separated Rust targets to install
    required: false
    default: ''
  install-libudev:
    description: Install libudev development package
    required: false
    default: 'false'
  cache-key:
    description: Optional rust-cache key suffix
    required: false
    default: ''
  cache-targets:
    description: Cache the Cargo target directory
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.install-libudev == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libudev-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        key: ${{ inputs.cache-key }}
        cache-targets: ${{ inputs.cache-targets }}
